name: kadi
description: "Kadi : la liste de courses du foyer."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.8"

dependencies:
  flutter:
    sdk: flutter
  drift: 2.35.3
  drift_flutter: 0.3.1
  flutter_riverpod: 3.4.3
  go_router: 18.1.1
  uuid: 4.6.0
  material_ui: 1.8.0
  image_picker: 1.2.4
  url_launcher: 6.3.3
  path_provider: 2.1.6
  wakelock_plus: 1.8.2
  image_picker_android: 0.8.13+25
  image_picker_platform_interface: 2.11.2
  archive: 4.6.0
  share_plus: 13.3.1
  file_picker: 13.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: 2.35.2
  build_runner: 2.16.2

flutter:
  uses-material-design: true
  assets:
    - assets/seed/
  fonts:
    # Phosphor Icons 2.1.1, style regular (MIT, voir assets/fonts/LICENSE).
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/Phosphor-Regular.ttf
