[[entry]]
id = 9
type = "story"
title = "Les six parcours de bout en bout, clair et sombre, sur la release installée"
description = "Suite de bout en bout dans `integration_test/` (convention Tests de l'architecture) : les six Key Flows d'EXPERIENCE.md, tels que les Decisions de l'initiative les ont modifiés (Fiche recette enregistrée par son bouton, coche ronde sur la carte), chacun en thème clair et en thème sombre, moment ★ vérifié par une assertion ; plus l'aller-retour export puis import sur une base neuve. Contrôles du plancher d'accessibilité sur chaque écran : cibles de 48 dp, libellés des cibles et contraste des textes (guidelines du test Flutter), police système ×2 sans débordement, animations désactivées sans attente. Puis le build release signé est installé sur le téléphone d'Antoine, après un export de la version en place ; cet export est importé sur une installation neuve de la même release (émulateur) et comparé ; Antoine passe les parcours avec TalkBack et fait de vraies courses de la semaine avec."
verify = "La suite d'intégration passe sur un émulateur ou le téléphone, six parcours × deux thèmes, plus l'aller-retour de sauvegarde ; l'import sur la release neuve de l'émulateur rend recettes, catalogue, fréquents, parcours, réglages et liste ; Antoine confirme la release installée, le passage TalkBack et une vraie semaine de courses."
covers = ["R7"]
after = [8]
hitl = true
risk = "medium"
notes = ["Clôt l'initiative : la closure check de l'initiative suit cette story, avec la confirmation d'Antoine."]
