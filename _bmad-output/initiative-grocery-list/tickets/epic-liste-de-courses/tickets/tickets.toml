# Stories de l'epic 1, dans l'ordre de construction.

[[entry]]
id = 1
type = "story"
title = "Kadi installée : un article cherché apparaît dans la Liste"
description = "Parcours traceur : projet Flutter Kadi (material_ui, thème clair et sombre, routeur à deux onglets, résolveur de pictos avec repli neutre), base Drift v1 avec toutes les tables de l'epic, horloge, réglages par défaut et chargeur de contenu fourni (AD-8) sur un premier fichier d'articles (Lait, Œufs, Tomates, Courgettes, Oignons, Riz, Lardons) ; Panneau + réduit au champ de recherche ; un tap crée la ligne et sa contribution « ajout » sans quantité ; Liste groupée par rayon et message « Ta liste est vide » ; test d'interdiction d'imports et test de migration ; build release signé installé. Annonces TalkBack et taille de police système sur ces écrans."
verify = "Sur le téléphone d'Antoine, la release Kadi s'ouvre sur la Liste vide ; taper « lait » dans le Panneau + puis toucher Lait l'affiche sous Crèmerie, en thème clair comme en sombre."
covers = ["R1", "R8", "R9", "R11", "R12"]
after = []
hitl = true
risk = "high"
plan_checkpoint = true
done_checkpoint = true
notes = ["Fait le 2026-10-26 : Flutter 3.47.8, clé de release C:/Users/admin/kadi-release.jks (alias kadi), identifiant fr.antoinegrb.kadi. Reste : Antoine inscrit le mot de passe dans android/key.properties."]

[[entry]]
id = 2
type = "story"
title = "Quantités : contributions, unités et fusion dans la liste"
description = "Complète les contributions posées par la story 1 avec les quantités et les unités (AD-4, AD-6) : quantité entière facultative dans l'unité de la ligne, somme pour un même article dans la même unité, deux lignes pour deux unités, arrondi de lecture dans la Liste. L'epic 2 s'appuie sur ce modèle pour la provenance."
verify = "Les tests du repository et des widgets montrent : Tomates 300 g puis 200 g donnent une ligne « Tomates 500 g », Tomates 2 pièces une seconde ligne, et 1500 g s'affiche « 1,5 kg »."
covers = ["R3"]
after = [1]
hitl = false
risk = "high"
plan_checkpoint = true

[[entry]]
id = 3
type = "story"
title = "Le catalogue et les fréquents fournis"
description = "Une IA génère le contenu complet pour le chargeur de la story 1 : articles.json (~200 articles : nom, picto_key, rayon, unité, UUID définitif, en gardant ceux de la story 1) et frequents.json (~30, ordre par rayon), avec un seed_version incrémenté."
verify = "Sur la release installée, la recherche trouve les ~200 articles avec leur rayon ; un test du chargeur montre qu'une nouvelle version insère les articles absents sans toucher un article modifié ou supprimé ; Antoine a relu et validé les deux fichiers."
covers = ["R9", "R10"]
