# Replan du 2026-11-01, après la 2e revue de l'app par Antoine : voir l'ajout en direct.

[[entry]]
id = 13
type = "story"
title = "Le Panneau + bas : la Liste visible derrière, l'ajout s'y voit"
description = "Panneau + bas (environ deux tiers de la zone libre au-dessus du clavier), sans voile, avec filet et ombre, poignée fine ; le bas de la Liste réserve sa hauteur et le message de liste vide se centre dans la zone libre. Objet partagé de features/liste/state (AD-19) : haut du panneau, demande de montrer une ligne. Tant que le panneau est ouvert, toute ligne nouvelle de la Liste arrive animée (hauteur, puis surlignage en fond de pastille qui s'efface) et, si elle serait masquée, la Liste défile jusqu'à la poser juste au-dessus du panneau ; sinon rien ne défile. Toutes les lignes sont bâties, pour pouvoir défiler jusqu'à une ligne hors écran. Entrée sur un article déjà dans la liste le montre et le surligne. La Ligne saisie disparaît. TalkBack annonce « Lait ajouté, Crèmerie » ; animations coupées : ni animation ni surlignage, saut direct."
verify = "Les tests de widgets montrent : avec 30 lignes, toucher un fréquent d'un rayon hors écran fait défiler la Liste jusqu'à ce que la ligne se termine au-dessus du haut du panneau ; une ligne déjà visible ne fait rien défiler ; Entrée sur un article présent le montre ; aucune Ligne saisie sous le champ ; le panneau laisse la Liste visible sans barrière colorée."
covers = ["R6", "R12", "R13", "R15"]
after = [12]
hitl = false
risk = "high"

[[entry]]
id = 14
type = "story"
title = "Le tag quantité et sa popup, sur les lignes du Panneau +"
description = "Toute ligne du Panneau + dans la liste (fréquent, résultat) montre, à gauche de sa coche, un tag quantité à la place du crayon : « Qté » en contour sans quantité, la quantité de sa plus ancienne ligne non cochée en plein sinon. Il ouvre la Popup quantité (DESIGN quantity-popup) : route légère du navigateur racine (AD-13), carte flottante juste au-dessus du panneau, fondu et léger zoom, titre = nom, Champ quantité focalisé, Choix d'unité, jamais le rayon ; Entrée, tap hors de la carte et retour ferment en enregistrant par le chemin d'AD-5 (fusion comprise) ; vide = sans quantité. La Feuille d'édition ne s'ouvre plus depuis le panneau : plus de feuille empilée, son crayon et sa suppression disparaissent du panneau, elle reste à l'appui long de la Liste. TalkBack : « Quantité de Lait, 500 g »."
verify = "Les tests de widgets montrent : Lait dans la liste affiche « Qté » ; toucher le tag ouvre une popup au-dessus du panneau sans Choix de rayon ; 2 et Entrée ferment la popup, le tag affiche « 2 » et la Liste « Lait 2 » ; vider le champ repasse à « Qté » ; aucun crayon dans le panneau ; l'appui long de la Liste ouvre toujours la Feuille d'édition."
covers = ["R3", "R5", "R12", "R14"]
after = [13]
hitl = false
risk = "medium"

