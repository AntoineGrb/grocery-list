title = "Créer un article et préciser quantité et rayon à l'ajout"
description = "Recherche sur tout le catalogue avec normalisation des noms (AD-17), « Créer « … » » sans correspondance exacte (Divers, sans unité par défaut), état vide sans résultat ; après un ajout, depuis un résultat ou un fréquent, champ quantité (unité par défaut préremplie) et Choix de rayon de la story 6, facultatifs, le rayon devenant celui de l'article créé ; libellés TalkBack et taille de police système."
