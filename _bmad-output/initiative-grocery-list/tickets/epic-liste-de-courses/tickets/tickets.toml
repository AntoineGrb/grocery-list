[[entry]]
id = 7
type = "story"
title = "Les fréquents dans le Panneau +"
description = "Le Panneau + s'ouvre clavier ouvert sur les fréquents groupés par rayon dans l'ordre du parcours ; l'état « dans la liste » se calcule ; un tap sur un fréquent ou sur un résultat déjà dans la liste retire tout l'article avec Annuler, sinon l'ajoute ; le panneau reste ouvert ; état vide « Pas encore de fréquents » ; état annoncé par TalkBack (« Lait, dans la liste »). Les pictos passent par le résolveur à repli neutre, le pack restant à choisir."
verify = "Toucher Lait dans les fréquents l'ajoute sous Crèmerie et sa ligne montre la coche ; le toucher de nouveau le retire, Annuler le remet ; cocher Lait dans la Liste repasse le fréquent à « + »."
covers = ["R6", "R7", "R11", "R12"]
after = [3, 5]
hitl = false
risk = "medium"

